name: Build Windows exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.js
      - uses: actions/upload-artifact@v4
        with:
          name: JiraTimeTracker
          path: dist/JiraTimeTracker.exe
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JiraTimeTracker.exe
          body: |
            Baixe **JiraTimeTracker.exe** e execute com duplo clique.
            A configuração (URL, e-mail, token) é salva em `%APPDATA%\JiraTimeTracker\config.json`.
